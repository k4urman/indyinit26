<!doctype html>
<!-- Demo fixture: delivery fee smishing landing page. Served as usps-redelivery.top. -->
<html><head><title>USPS - Package on hold</title></head>
<body style="font-family:sans-serif;max-width:480px;margin:40px auto">
<header><img alt="USPS" src="usps-logo.png" width="100" height="30"></header>
<h1>USPS Tracking</h1>
<p>Your package is on hold due to an incomplete address. Pay a $1.99 redelivery fee to schedule delivery. Final notice: the parcel will be returned within 48 hours.</p>
<form id="pay">
  <label for="cc">Card number</label><br><input id="cc" name="cardnumber" autocomplete="cc-number"><br>
  <label for="exp">Expiry</label><br><input id="exp" name="exp" autocomplete="cc-exp"><br><br>
  <button>Pay $1.99</button>
</form>
</body></html>
